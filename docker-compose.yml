services:
  db:
    image: postgres:17
    container_name: go_clean_auth_api_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_clean_auth_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_clean_auth_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: go_clean_auth_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.20.0
    container_name: go_clean_auth_api_swagger
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/app/openapi.yaml:ro

volumes:
  postgres_data:
